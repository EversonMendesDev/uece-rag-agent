services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uece_pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: uece_rag
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: